# Dog 2 – OpenMV precision picking + MyArm-2 arm configuration.

dog2:
  robot_id: lite3_02
  description: "Picking dog – OpenMV + depth camera + MyArm-2 arm"

hardware:
  openmv:
    port: /dev/ttyACM0
    baudrate: 115200
  depth_camera:
    type: realsense_d435
    color_topic: /dog2/camera/color/image_raw
    depth_topic: /dog2/camera/aligned_depth_to_color/image_raw
  arm:
    port: /dev/ttyUSB0
    baudrate: 115200
    pick_group: 1
    place_group: 2
    home_command: "$DJR!"
    stop_command: "$DST!"
    pick_timeout_sec: 15.0
    place_timeout_sec: 15.0

# Shared map from Dog 1 (must be frozen + hash-verified before use).
map:
  shared_topic: /shared_map
  local_topic: /map
  metadata_topic: /shared_map/metadata

# Localisation on Dog 1's shared map.
# Node parameters (initial pose, convergence thresholds) are authoritative in
# config/picking_params.yaml under `dog2_localization`.  Edit the surveyed
# initial_x / initial_y / initial_yaw there before first run.
# This section is kept only as documentation of the contract.
localization:
  amcl_pose_topic: /amcl_pose
  initial_pose_topic: /initialpose
  localization_status_topic: /dog2/localization_status
  localization_info_topic: /dog2/localization_info
  note: "initial pose lives in picking_params.yaml (dog2_localization)"

# Workspaces (must match fleet_manager/config/fleet.yaml).
workspaces:
  - id: ws_pick_zone_01
    description: "Primary pick/place zone"
    approach_x: 4.0     # SURVEYED
    approach_y: 5.0
    approach_yaw: 0.0
    centre_x: 5.0
    centre_y: 5.0
    retreat_x: 4.0
    retreat_y: 5.0
    retreat_yaw: 3.1416

  - id: ws_pick_zone_02
    description: "Secondary pick/place zone"
    approach_x: 8.0     # SURVEYED
    approach_y: 3.0
    approach_yaw: 0.0
    centre_x: 9.0
    centre_y: 3.0
    retreat_x: 8.0
    retreat_y: 3.0
    retreat_yaw: 3.1416

# Home position (idle pose).
home:
  x: 0.0              # SURVEYED
  y: 0.0
  yaw: 0.0
  frame_id: map

navigation:
  action_name: navigate_to_pose
  server_wait_sec: 2.0

openmv:
  pixel_width: 320
  pixel_height: 240
  target_min_width: 20
  target_max_width: 200
  mm_per_pixel: 0.5            # REQUIRES CALIBRATION
  arm_offset_x_mm: 100.0
  arm_offset_y_mm: 0.0
  arm_offset_z_mm: 50.0
  stable_frames: 10
  positioning_timeout_sec: 30.0

# ---- Large-model (VLM) recognition ----
# The model recognises the target and returns the same detection JSON schema;
# picking_manager gates PICK on it according to target_source/vlm_required.
# A VLM result is advisory: it never writes to the arm directly.
vlm:
  enabled: true
  backend: mock                 # mock (offline bench) | http (OpenAI-compatible server)
  endpoint: ""                  # e.g. http://127.0.0.1:8000/v1/chat/completions
  model: ""                     # e.g. qwen2.5-vl-7b / gpt-4o-mini / llama3.2-vision
  api_key_env: VLM_API_KEY      # read from environment; empty for local servers
  prompt: >-
    你是机器狗视觉识别模块。找出画面中需要抓取的目标。只输出 JSON，不要输出解释，
    格式：{"detections":[{"class_name":"block","confidence":0.9,
    "bbox":[x1,y1,x2,y2],"grasp_point":[u,v]}]}。
  timeout_sec: 8.0
  retries: 1
  min_confidence: 0.50
  allowed_classes: [block]
  max_tokens: 512
  use_json_mode: false          # true only if the server supports response_format
  image_topic: /dog2/camera/color/image_raw
  output_topic: /dog2/vlm_detections
  status_topic: /dog2/vlm_status
  process_every_n_frames: 15
  jpeg_quality: 80
  mock_detections: ""           # JSON string; empty = mock emits no detections
  target_source: openmv         # openmv | vlm | any
  vlm_required: false           # openmv mode: require VLM confirmation too
  require_openmv: true          # vlm mode: still require OpenMV fine position
  vlm_min_confidence: 0.50
  vlm_stable_frames: 5
  vlm_stale_sec: 3.0

safety:
  max_linear_x: 0.30
  max_linear_y: 0.15
  max_angular_z: 0.50
  estop_topic: /dog2/estop

fleet:
  mode: true
  heartbeat_topic_base: /fleet/heartbeat
  heartbeat_interval_sec: 1.0
